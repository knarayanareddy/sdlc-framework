name: pipeline

on:
  push:
  pull_request:

jobs:
  tools:
    name: pipeline tools (zero-dependency, node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: every tool passes its own test
        run: node pipeline/tools/run-selftests.mjs

      - name: the gate ledger catches a single edited line
        run: node pipeline/tools/gate-ledger.mjs demo

      - name: the worked example walks phases 00 → 12
        run: node pipeline/tools/demo.mjs

      - name: traceability on the example spec
        run: |
          node pipeline/tools/trace-check-v2.mjs \
            pipeline/examples/mini-app/docs/02-spec/SPEC.md \
            pipeline/examples/mini-app/tests --allow-uncovered

      - name: report what this runner can and cannot enforce
        run: |
          node pipeline/tools/sandbox.mjs check
          node pipeline/tools/dast.mjs plan
          node pipeline/tools/verifier-route.mjs status
          node pipeline/tools/calibrate.mjs status --dir /tmp/no-calibration || true

      # B-36: the suite tested live-check's logic but nothing ever ran the tool, so its own
      # environment assumptions were never exercised. It is allowed to find the runner bare
      # (exit 3); it is not allowed to crash or to produce a report that does not parse.
      - name: live-check probe runs here and produces a report
        run: |
          set +e
          node pipeline/tools/live-check.mjs probe --json > "$RUNNER_TEMP/live.json"
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then
            echo "live-check probe exited $code (expected 0 = all ready, 3 = NOT_VERIFIED)"
            exit 1
          fi
          node -e '
            const report = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            if (!Array.isArray(report.items) || report.items.length !== 4) {
              console.error("expected 4 P6 items, saw " + (report.items ?? []).length);
              process.exit(1);
            }
            for (const item of report.items) {
              if (!["ready", "partial", "blocked"].includes(item.state)) {
                console.error(`${item.id}: unknown state ${item.state}`);
                process.exit(1);
              }
              if (!item.next || !item.flips) {
                console.error(`${item.id}: a report row without next/flips is not a plan`);
                process.exit(1);
              }
            }
            console.log("live-check probe: " + report.items.map((i) => `${i.id}=${i.state}`).join(", "));
          ' "$RUNNER_TEMP/live.json"

      - name: the fuzzer finds a trusting server and passes a strict one
        run: node --test pipeline/tools/fuzz-api.test.mjs

      - name: campaign — a sandboxed run of the example's own tests
        run: |
          node pipeline/tools/sandbox.mjs run --copy pipeline/examples/mini-app \
            --cmd "node --test" --timeout 120000 --max-output 20000 \
            --out /tmp/sandbox-record.json

      # The suite used to fail on any checkout under os.tmpdir(), which GitHub Actions never
      # hits: the runner checks out under /home/runner/work (SECOND-OPINION-3 G-11/G-24).
      - name: the suite also passes from a clone under $RUNNER_TEMP
        run: |
          git clone -q . "$RUNNER_TEMP/clone"
          cd "$RUNNER_TEMP/clone"
          node pipeline/tools/run-selftests.mjs

      # `verify` re-runs every recorded gate and compares it with the ledger. CI never ran it,
      # so nothing here would have noticed a ledger that no longer described the tree.
      - name: verify a worked example end to end, and fail on drift
        run: |
          node pipeline/tools/demo.mjs --keep | tee /tmp/demo.log
          work=$(sed -n 's/^worked example → //p' /tmp/demo.log | head -1)
          test -n "$work" || { echo "could not read the demo's work dir"; exit 1; }
          # The work dir is a copy of the example app, not of this repo: run the CLI from here.
          cd "$work" && node "$GITHUB_WORKSPACE/pipeline/bin/pipeline.mjs" verify

      - name: entry-point enumerator is deterministic
        run: |
          cd pipeline/examples/mini-app
          node ../../tools/entrypoints.mjs --root . --out /tmp/a.json --stable
          node ../../tools/entrypoints.mjs --root . --out /tmp/b.json --stable
          diff /tmp/a.json /tmp/b.json

  review-app:
    name: review app (The Line)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: comprehensive-development-lifecycle-prompts
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: comprehensive-development-lifecycle-prompts/package-lock.json

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: tests (unit, data integrity, real Postgres)
        run: npx vitest run

      - name: production build
        run: npm run build
